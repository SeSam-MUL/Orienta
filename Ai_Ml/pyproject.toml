[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsd-ai"
version = "0.1.0"
description = "Machine Learning Phase Classifier for EBSD Patterns"
requires-python = ">=3.10"
dependencies = [
    # NOTE: install the repository's root requirements.txt FIRST. These ranges
    # cannot name a CUDA build (a pyproject carries no --extra-index-url), so
    # `pip install -e Ai_Ml` into a bare environment resolves torch from PyPI,
    # which is CPU-only on Windows. The root requirements.txt pins
    # torch==2.11.0+cu126 and satisfies these ranges; see
    # tests/test_requirements_torch_index_guard.py for why that pin is exact.
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "h5py>=3.8",
    "scikit-image>=0.20",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["ebsd_ai*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
