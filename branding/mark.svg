<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 25 76 66" width="76" height="66" role="img" aria-label="Orienta">
  <!-- The IPF triangle on its own — no plate, no padding, transparent background.
       For slides, posters and headers where the mark sits on your own surface.
       Same geometry as icon.svg; the viewBox is cropped to the triangle. -->
  <defs>
    <clipPath id="mkTri"><path d="M60 25 98 91 22 91Z"/></clipPath>
    <radialGradient id="mkR" cx="50%" cy="4%" r="105%"><stop offset="0" stop-color="#ff3b3b"/><stop offset=".42" stop-color="#ff3b3b" stop-opacity=".18"/><stop offset=".66" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="mkG" cx="92%" cy="98%" r="105%"><stop offset="0" stop-color="#22dd66"/><stop offset=".42" stop-color="#22dd66" stop-opacity=".18"/><stop offset=".66" stop-color="#22dd66" stop-opacity="0"/></radialGradient>
    <radialGradient id="mkB" cx="8%" cy="98%" r="105%"><stop offset="0" stop-color="#2f7bff"/><stop offset=".42" stop-color="#2f7bff" stop-opacity=".18"/><stop offset=".66" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#mkTri)" style="isolation:isolate">
    <rect width="120" height="120" fill="#0f1830"/>
    <rect width="120" height="120" fill="url(#mkR)" style="mix-blend-mode:screen"/>
    <rect width="120" height="120" fill="url(#mkG)" style="mix-blend-mode:screen"/>
    <rect width="120" height="120" fill="url(#mkB)" style="mix-blend-mode:screen"/>
  </g>
</svg>
