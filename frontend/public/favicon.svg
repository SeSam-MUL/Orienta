<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Orienta">
  <!-- Orienta browser-tab icon: the IPF orientation triangle, same geometry as
       branding/icon.svg. The white outline is deliberately omitted here — at
       16-32 px it muddies the apex instead of defining it. -->
  <defs>
    <clipPath id="fvTri"><path d="M60 25 98 91 22 91Z"/></clipPath>
    <radialGradient id="fvR" cx="50%" cy="4%" r="105%"><stop offset="0" stop-color="#ff3b3b"/><stop offset=".42" stop-color="#ff3b3b" stop-opacity=".18"/><stop offset=".66" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <radialGradient id="fvG" cx="92%" cy="98%" r="105%"><stop offset="0" stop-color="#22dd66"/><stop offset=".42" stop-color="#22dd66" stop-opacity=".18"/><stop offset=".66" stop-color="#22dd66" stop-opacity="0"/></radialGradient>
    <radialGradient id="fvB" cx="8%" cy="98%" r="105%"><stop offset="0" stop-color="#2f7bff"/><stop offset=".42" stop-color="#2f7bff" stop-opacity=".18"/><stop offset=".66" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="5" y="5" width="110" height="110" rx="27" fill="#0f141b"/>
  <g clip-path="url(#fvTri)">
    <rect width="120" height="120" fill="#0f1830"/>
    <rect width="120" height="120" fill="url(#fvR)" style="mix-blend-mode:screen"/>
    <rect width="120" height="120" fill="url(#fvG)" style="mix-blend-mode:screen"/>
    <rect width="120" height="120" fill="url(#fvB)" style="mix-blend-mode:screen"/>
  </g>
</svg>
