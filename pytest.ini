[pytest]
testpaths = tests
addopts = -p no:cacheprovider -m "not network"
markers =
    integration: mark test as integration test (uses real data files, slower)
    large_file: opt-in regression against the 27 GB H5OINA file (skipped unless env var KIKUCHIPY_LARGE_TEST_FILE points to a real file)
    slow: takes minutes (a real interpreter, a real simulation). Runs by default; exclude with -m 'not slow'.
    network: opt-in; makes live HTTPS requests. Run with `pytest -m network`.
